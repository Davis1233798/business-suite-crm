services:
  edge:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      MAIN_DOMAIN: ${MAIN_DOMAIN:?set MAIN_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./linux/Caddyfile.web:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: {condition: service_healthy}
volumes:
  caddy-data:
  caddy-config:
