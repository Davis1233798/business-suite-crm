services:
  edge:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./linux/Caddyfile.subdomains:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: {condition: service_healthy}
volumes:
  caddy-data:
  caddy-config:
