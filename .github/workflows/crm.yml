name: CRM validation and container publication
on:
  push:
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  windows-desktop:
    needs: crm
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            tcl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build pinned SQLCipher C library with OpenSSL
        shell: msys2 {0}
        run: bash .github/scripts/build-sqlcipher-windows.sh
      - name: Verify real SQLCipher encryption on Windows
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '1'
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;$env:PATH"
          $env:CC = 'gcc'
          $sqlcipherRoot = Join-Path $env:GITHUB_WORKSPACE '.sqlcipher-windows\source'
          $sqlcipherMsysPath = & "${{ steps.msys2.outputs.msys2-location }}\usr\bin\cygpath.exe" -m $sqlcipherRoot
          $env:CGO_CFLAGS = "-I$sqlcipherMsysPath"
          $env:CGO_LDFLAGS = "-L$sqlcipherMsysPath -lcrypto"
          go -C backend test -tags libsqlite3 -run '^TestWindowsExternalSQLCipherRejectsPlaintextWrongAndMissingKeys$' -count=1
      - run: npm run install:ci
      - name: Check CRM desktop identity and data boundaries
        run: node --test tests/desktop-identity.test.cjs
      - name: Build Windows CRM desktop backend and assets
        run: npm run desktop:prepare
      - name: Package unpacked Windows CRM desktop app
        run: npm run desktop:package
      - uses: actions/upload-artifact@v4
        with:
          name: relationdesk-crm-windows-${{ github.sha }}
          path: outputs/desktop/win-unpacked/
          if-no-files-found: error
          retention-days: 7

  crm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm run install:ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Verify desktop and container release workflow boundaries
        run: node --test tests/desktop-workflow.test.cjs
      - run: go -C backend test -race -timeout=20m ./...
      - run: npm run web:build
      - name: Build CRM image
        run: docker build -f infra/linux/Dockerfile.station -t crm-ci:${GITHUB_SHA} .
      - name: Smoke-test isolated CRM image
        run: |
          set -euo pipefail
          docker run -d --name crm-ci -p 127.0.0.1:18095:8095 crm-ci:${GITHUB_SHA}
          trap 'docker logs crm-ci; docker rm -f crm-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18095/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18095/api/health > /dev/null
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:18095/mes/login)" = 404
      - name: Install Chromium for real CRM workflow acceptance
        run: npx playwright install --with-deps chromium
      - name: Verify browser lead conversion against the Go image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name crm-browser -p 127.0.0.1:18095:8095 crm-ci:${GITHUB_SHA}
          trap 'docker logs crm-browser; docker rm -f crm-browser' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18095/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18095/api/health > /dev/null
          npx playwright test --config playwright.crm.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crm-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [crm, windows-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run install:ci
      - run: npm run web:build
      - name: Build CRM image after all platform checks
        run: docker build -f infra/linux/Dockerfile.station -t crm-release:${GITHUB_SHA} .
      - name: Publish CRM image on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/business-suite-crm"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag crm-release:${GITHUB_SHA} "$image:${GITHUB_SHA}"
          docker push "$image:${GITHUB_SHA}"
